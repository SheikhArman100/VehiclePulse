services:
  # -------------------------------------------------------------
  # 1. Reverse Proxy (Local-first entry point)
  # -------------------------------------------------------------
  nginx:
    image: nginx:1.27.4-alpine
    container_name: vehiclepulse-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vehiclepulse-network

  # -------------------------------------------------------------
  # 1b. Telemetry Service (Node.js Express Microservice)
  # -------------------------------------------------------------
  telemetry-service:
    build:
      context: .
      dockerfile: services/telemetry-service/Dockerfile
    container_name: vehiclepulse-telemetry-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      NODE_ENV: development
      SERVICE_NAME: telemetry-service
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongodb:27017/vehiclepulse_telemetry
      KAFKA_BROKERS: kafka:29092
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4001/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vehiclepulse-network

  # -------------------------------------------------------------
  # 1c. Analytics Service (PostgreSQL & Kafka Consumer Worker)
  # -------------------------------------------------------------
  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: vehiclepulse-analytics-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      NODE_ENV: development
      SERVICE_NAME: analytics-service
      LOG_LEVEL: info
      POSTGRES_URL: postgresql://${POSTGRES_USER:-vp_analytics_user}:${POSTGRES_PASSWORD:-vp_analytics_password}@postgres:5432/${POSTGRES_DB:-vehiclepulse_analytics}?schema=public
      RUNNING_IN_DOCKER: "true"
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: analytics-consumer-group
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4002/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vehiclepulse-network


  # -------------------------------------------------------------
  # 2. MongoDB (Telemetry Service - Time-series & Device Data)
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0.14
    container_name: vehiclepulse-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-vehiclepulse_telemetry}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vehiclepulse-network

  # -------------------------------------------------------------
  # 3. PostgreSQL (Analytics Service - Aggregates & Trip Tables)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16.8
    container_name: vehiclepulse-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vehiclepulse_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-vp_analytics_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vp_analytics_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vp_analytics_user} -d ${POSTGRES_DB:-vehiclepulse_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vehiclepulse-network

  # -------------------------------------------------------------
  # 4. MySQL (Alert Service - Transactional Incidents & Rules)
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.4
    platform: linux/amd64
    container_name: vehiclepulse-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vehiclepulse_alerts}
      MYSQL_USER: ${MYSQL_USER:-vp_alerts_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vp_alerts_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vp_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-vp_alerts_user}", "-p${MYSQL_PASSWORD:-vp_alerts_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vehiclepulse-network

  # -------------------------------------------------------------
  # 5. Redis (Real-Time State, Cache & Pub/Sub for WebSockets)
  # -------------------------------------------------------------
  redis:
    image: redis:7.4.2-alpine
    container_name: vehiclepulse-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vehiclepulse-network

  # -------------------------------------------------------------
  # 6. RabbitMQ (Async Jobs, Vehicle Commands, Retries & DLQ)
  # -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: vehiclepulse-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - vehiclepulse-network

  # -------------------------------------------------------------
  # 7. Kafka (Event Streaming Backbone in lightweight KRaft mode)
  # -------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.1
    container_name: vehiclepulse-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "4L622nShT-2xOihttLYXKA"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - vehiclepulse-network

# ---------------------------------------------------------------
# Persistent Data Volumes
# ---------------------------------------------------------------
volumes:
  mongo_data:
  postgres_data:
  mysql_data:
  redis_data:
  rabbitmq_data:
  kafka_data:

# ---------------------------------------------------------------
# Internal Network
# ---------------------------------------------------------------
networks:
  vehiclepulse-network:
    driver: bridge
