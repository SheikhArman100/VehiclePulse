events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;



    server {
        listen 80;
        server_name localhost;

        # Docker internal DNS resolver
        resolver 127.0.0.11 valid=10s;

        # Client body size for telemetry batch ingestion
        client_max_body_size 10M;

        # Proxy timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Telemetry Service routes
        location /api/telemetry/ {
            set $telemetry_upstream http://telemetry-service:4001;
            proxy_pass $telemetry_upstream;
        }

        # Analytics Service routes
        location /api/analytics/ {
            set $analytics_upstream http://analytics-service:4002;
            proxy_pass $analytics_upstream;
        }

        # Alert Service routes
        location /api/alerts/ {
            set $alert_upstream http://alert-service:4003;
            proxy_pass $alert_upstream;
        }

        # WebSocket Upgrade proxy for live state updates
        location /ws {
            set $ws_upstream http://telemetry-service:4001;
            proxy_pass $ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Health smoke check for Nginx reverse proxy
        location /nginx-health {
            access_log off;
            return 200 '{"status":"UP","service":"nginx-reverse-proxy"}\n';
            add_header Content-Type application/json;
        }

        # Default fallback to frontend Next.js application
        location / {
            set $frontend_upstream http://frontend-web:3000;
            proxy_pass $frontend_upstream;
        }
    }
}
