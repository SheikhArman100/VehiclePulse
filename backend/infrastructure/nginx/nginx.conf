events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Hide Nginx server version for security hardening
    server_tokens off;

    # Rate limiting zones
    # 1. Ingestion limit: 200 requests/sec per IP with 50 burst
    limit_req_zone $binary_remote_addr zone=telemetry_ingest_limit:10m rate=200r/s;
    # 2. General API limit: 50 requests/sec per IP with 20 burst
    limit_req_zone $binary_remote_addr zone=general_api_limit:10m rate=50r/s;

    # Security headers applied globally
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server {
        listen 80;
        server_name localhost;

        # Docker internal DNS resolver
        resolver 127.0.0.11 valid=10s;

        # Client body size for telemetry batch ingestion
        client_max_body_size 10M;

        # Proxy timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Telemetry Service routes
        location /api/telemetry/ {
            limit_req zone=telemetry_ingest_limit burst=50 nodelay;
            set $telemetry_upstream http://telemetry-service:4001;
            proxy_pass $telemetry_upstream;
        }

        # Analytics Service routes
        location /api/analytics/ {
            limit_req zone=general_api_limit burst=20 nodelay;
            set $analytics_upstream http://analytics-service:4002;
            proxy_pass $analytics_upstream;
        }

        # Alert Service routes
        location /api/alerts/ {
            limit_req zone=general_api_limit burst=20 nodelay;
            set $alert_upstream http://alert-service:4003;
            proxy_pass $alert_upstream;
        }

        # WebSocket Upgrade proxy for live state updates
        location /ws {
            set $ws_upstream http://telemetry-service:4001;
            proxy_pass $ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Health smoke check for Nginx reverse proxy
        location /nginx-health {
            access_log off;
            return 200 '{"status":"UP","service":"nginx-reverse-proxy"}\n';
            add_header Content-Type application/json;
        }

        # Default fallback to frontend Next.js application
        location / {
            set $frontend_upstream http://frontend-web:3000;
            proxy_pass $frontend_upstream;
        }
    }
}
