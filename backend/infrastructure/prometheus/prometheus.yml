global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "telemetry-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["telemetry-service:4001", "host.docker.internal:4001"]

  - job_name: "analytics-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["analytics-service:4002", "host.docker.internal:4002"]

  - job_name: "alert-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["alert-service:4003", "host.docker.internal:4003"]

